<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futures Backtest Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --accent:#34d399;
  --bg:#0d0f13;
  --bg-2:#12151b;
  --panel:#161a22;
  --panel-2:#1b202a;
  --elev:#20262f;
  --line:rgba(255,255,255,0.07);
  --line-2:rgba(255,255,255,0.11);
  --tx:#e7ebf2;
  --tx-2:#9aa3b5;
  --tx-3:#646d80;
  --pos:#34d399;
  --neg:#f87171;
  --warn:#fbbf24;
  --good:#34d399;
  --mid:#94a3b8;
  --bad:#f87171;
  --r:13px;
  --r-sm:9px;
  --mono:'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace;
  --sans:'IBM Plex Sans Thai','IBM Plex Sans',system-ui,sans-serif;
  --pad:22px;
  --gap:18px;
}
body[data-density="compact"]{--pad:15px;--gap:12px;--r:11px;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--tx);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.tnum,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:color-mix(in oklch,var(--accent) 40%,transparent)}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#2a313d;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#39424f;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh}
body[data-density="compact"] .app{grid-template-columns:224px 1fr}

/* ============ SIDEBAR ============ */
#sidebar{
  background:linear-gradient(180deg,var(--bg-2),var(--bg));
  border-right:1px solid var(--line);
  padding:20px 16px;
  display:flex;flex-direction:column;gap:18px;
  overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:none;
  display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,color-mix(in oklch,var(--accent) 28%,transparent),color-mix(in oklch,var(--accent) 8%,transparent));
  color:var(--accent);border:1px solid color-mix(in oklch,var(--accent) 30%,transparent);
}
.brand-txt{font-size:12px;color:var(--tx-3);line-height:1.25;letter-spacing:.04em;text-transform:uppercase}
.brand-txt strong{font-size:16px;color:var(--tx);letter-spacing:.01em;text-transform:none}

.nav-group-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-3);padding:0 6px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-sep{height:1px;background:var(--line);margin:8px 4px}
.nav-item{
  display:flex;align-items:center;gap:11px;
  width:100%;padding:9px 11px;border-radius:var(--r-sm);
  background:transparent;border:1px solid transparent;cursor:pointer;
  color:var(--tx-2);font-family:var(--sans);font-size:13.5px;text-align:left;
  transition:.13s;
}
.nav-item:hover{background:var(--panel);color:var(--tx)}
.nav-item.active{background:var(--panel-2);border-color:var(--line-2);color:var(--tx)}
.nav-item.active .nav-dot{box-shadow:0 0 0 3px color-mix(in oklch,var(--c) 22%,transparent)}
.nav-dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent));flex:none;transition:.13s}
.nav-glyph{font-size:15px;width:18px;text-align:center;flex:none;filter:saturate(1.1)}
.nav-label{display:flex;flex-direction:column;line-height:1.15}
.nav-label em{font-style:normal;font-size:10.5px;color:var(--tx-3);font-family:var(--mono)}

.side-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;position:relative;overflow:hidden;
}
.side-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.side-card-h{font-weight:600;font-size:13.5px}
.side-card-sub{font-size:11.5px;color:var(--tx-3);margin:2px 0 10px}
.side-kv{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px}
.side-kv dt{color:var(--tx-3)}
.side-kv dd{text-align:right;font-family:var(--mono);color:var(--tx);font-size:11.5px}

.side-status{
  background:color-mix(in oklch,var(--pos) 8%,var(--panel));
  border:1px solid color-mix(in oklch,var(--pos) 22%,transparent);
  border-radius:var(--r);padding:11px 13px;font-size:12px;color:var(--tx-2);
}
.side-status-sub{font-family:var(--mono);font-size:10.5px;color:var(--tx-3);margin-top:3px}
.dot-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pos);margin-right:6px;box-shadow:0 0 8px var(--pos);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.45}}

.side-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn{
  font-family:var(--sans);font-size:13px;font-weight:500;
  padding:10px 14px;border-radius:var(--r-sm);cursor:pointer;border:1px solid var(--line-2);
  background:var(--panel);color:var(--tx);transition:.14s;
}
.btn:hover{background:var(--elev);border-color:#39424f}
.btn-primary{
  background:linear-gradient(135deg,color-mix(in oklch,var(--accent) 92%,#000),color-mix(in oklch,var(--accent) 70%,#000));
  color:#06140e;border-color:transparent;font-weight:600;
}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent}

/* ============ MAIN ============ */
.main-wrap{display:flex;flex-direction:column;min-width:0;height:100vh}
#topbar{
  display:flex;align-items:center;gap:16px;
  padding:16px var(--pad);border-bottom:1px solid var(--line);
  background:color-mix(in oklch,var(--bg-2) 70%,transparent);backdrop-filter:blur(8px);
  position:relative;z-index:20;
}
.tb-title h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.tb-title p{font-size:12.5px;color:var(--tx-3);margin-top:1px}
.tb-right{display:flex;align-items:center;gap:10px;margin-left:auto;position:relative}
.tb-chip{
  font-size:10.5px;color:var(--tx-2);font-family:var(--mono);
  padding:5px 10px;border-radius:7px;background:var(--panel);border:1px solid var(--line);
  white-space:nowrap;
}
.tb-chip span{color:var(--tx-3);margin-right:5px}

.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{
  font-family:var(--sans);font-size:12.5px;color:var(--tx-2);background:transparent;border:0;
  padding:6px 13px;border-radius:6px;cursor:pointer;transition:.13s;
}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--elev);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.seg.sm button{padding:5px 9px;font-size:11.5px;display:flex;align-items:center;gap:5px;text-transform:capitalize}
.seg.sm i{width:10px;height:10px;border-radius:3px;display:inline-block}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--tx-2);cursor:pointer;font-size:15px;transition:.13s;
}
.icon-btn:hover{color:var(--tx);background:var(--elev)}

.popover{
  position:absolute;top:46px;right:0;width:268px;z-index:50;
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r);
  padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.55);
  animation:pop .14s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.pop-h{font-weight:600;font-size:13px;margin-bottom:10px}
.pop-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pop-row label{font-size:12px;color:var(--tx-2)}
.pop-note{font-size:10.5px;color:var(--tx-3);line-height:1.4;border-top:1px solid var(--line);padding-top:9px}

#main{flex:1;overflow-y:auto;padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap)}

/* ============ OPT BANNER ============ */
.opt-banner{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:color-mix(in oklch,var(--pos) 7%,var(--panel));
  border:1px solid color-mix(in oklch,var(--pos) 20%,transparent);
  border-radius:var(--r);padding:11px 16px;font-size:12.5px;color:var(--tx-2);
}
.opt-banner .ok{width:18px;height:18px;border-radius:50%;background:var(--pos);color:#04140c;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.opt-banner b{color:var(--tx)}
.opt-banner-meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--tx-3)}

/* ============ CARDS ============ */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
@media(max-width:1180px){.cards{grid-template-columns:1fr}}
.scard{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--pad);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;
  transition:.16s;
}
.scard::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--c),transparent 70%)}
.scard:hover{border-color:color-mix(in oklch,var(--c) 32%,var(--line))}
.scard-h{display:flex;align-items:center;gap:12px}
.badge{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:none}
.badge.lg{width:46px;height:46px;font-size:23px}
.scard-name{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0}
.scard-name b{font-size:17px;font-weight:600}
.scard-name em{font-style:normal;font-size:11px;color:var(--tx-3);font-family:var(--mono)}
.score-pill{
  font-size:8.5px;letter-spacing:.1em;color:var(--tx-3);text-align:right;line-height:1.1;
  font-weight:600;padding:5px 10px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line);
}
.score-pill b{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:0;display:block;margin-top:1px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:10.5px;font-family:var(--mono);color:var(--tx-2);
  padding:4px 9px;border-radius:6px;background:var(--bg-2);border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:5px;
}
.chip i{font-style:normal;opacity:.7}

.ret-block{padding:6px 0 0}
.ret-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3);font-weight:600}
.ret-big{font-family:var(--mono);font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:1px}
body[data-density="compact"] .ret-big{font-size:32px}
.ret-big.pos{color:var(--pos)}
.ret-big.neg{color:var(--neg)}
.scard.big .ret-big{font-size:50px}
.spark{display:block;width:100%;margin-top:6px}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 9px;text-align:left}
.kpi span{display:block;font-size:9.5px;color:var(--tx-3);letter-spacing:.05em;text-transform:uppercase}
.kpi b{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:2px;display:block}
.kpi.v-good b{color:var(--good)} .kpi.v-bad b{color:var(--bad)} .kpi.v-mid b{color:var(--tx)}

/* metric bars */
.mbars{display:flex;flex-direction:column;gap:7px}
.mbars.wide{display:grid;grid-template-columns:1fr 1fr;gap:9px 22px}
.mbar{display:grid;grid-template-columns:108px 1fr 64px;align-items:center;gap:10px}
.mbar-k{font-size:11.5px;color:var(--tx-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.mbar-k .win{font-style:normal;font-size:8px;font-weight:700;letter-spacing:.06em;color:#04140c;background:var(--warn);padding:1px 4px;border-radius:4px}
.mbar-track{height:6px;border-radius:4px;background:var(--bg-2);overflow:hidden;border:1px solid var(--line)}
.mbar-fill{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mbar-v{font-family:var(--mono);font-size:12.5px;text-align:right;font-weight:500}
.mbar.v-good .mbar-fill{background:var(--good)} .mbar.v-good .mbar-v{color:var(--good)}
.mbar.v-mid .mbar-fill{background:var(--mid)} .mbar.v-mid .mbar-v{color:var(--tx)}
.mbar.v-bad .mbar-fill{background:var(--bad)} .mbar.v-bad .mbar-v{color:var(--bad)}
.mbar.is-winner{position:relative}

/* params */
.params{border-top:1px solid var(--line);padding-top:12px}
.params summary{font-size:11.5px;color:var(--tx-2);cursor:pointer;list-style:none;font-weight:500;user-select:none}
.params summary::-webkit-details-marker{display:none}
.params summary::before{content:"▸";margin-right:7px;color:var(--tx-3);transition:.13s;display:inline-block}
.params[open] summary::before{transform:rotate(90deg)}
.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:10px}
.param-grid code{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;padding:3px 0;border-bottom:1px dotted var(--line)}
.param-grid code span{color:var(--tx-3)}
.param-grid code b{color:var(--accent);font-weight:500}

.btn-detail{
  margin-top:2px;background:var(--bg-2);border:1px solid var(--line);color:var(--tx-2);
  font-size:12.5px;padding:10px;border-radius:var(--r-sm);width:100%;cursor:pointer;transition:.14s;font-family:var(--sans);
}
.btn-detail:hover{background:var(--elev);color:var(--tx);border-color:var(--line-2)}

/* ============ MATRIX ============ */
.matrix-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th,.matrix td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.matrix thead th{background:var(--bg-2);font-weight:600;font-size:13.5px;border-bottom:1px solid var(--line-2)}
.matrix thead th[style]{border-bottom:2px solid var(--c)}
.matrix thead th em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--tx-3);display:block;font-weight:400}
.mx-badge{margin-right:7px;font-size:14px}
.mx-metric{color:var(--tx);font-weight:500}
.mx-metric em{font-style:normal;display:block;font-size:9.5px;color:var(--tx-3);font-weight:400;letter-spacing:.03em}
.matrix tbody tr:hover{background:var(--bg-2)}
.matrix td:not(.mx-metric){width:23%}
.mx-cell{display:flex;align-items:center;gap:10px}
.mx-bar{flex:1;height:5px;border-radius:3px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden;max-width:90px}
.mx-bar span{display:block;height:100%;border-radius:3px;opacity:.85}
.mx-v{font-family:var(--mono);font-size:13px;font-weight:500;white-space:nowrap}
.mx-v .win{font-style:normal;color:var(--warn)}
td.v-good .mx-v{color:var(--good)} td.v-bad .mx-v{color:var(--bad)} td.v-mid .mx-v{color:var(--tx)}
td.is-winner{background:color-mix(in oklch,var(--warn) 6%,transparent)}
.mx-na{color:var(--tx-3);font-family:var(--mono)}

/* ============ SPOTLIGHT ============ */
.spotlight{display:grid;grid-template-columns:1.45fr 1fr;gap:var(--gap)}
@media(max-width:1180px){.spotlight{grid-template-columns:1fr}}
.spot-main{display:flex;flex-direction:column;gap:12px}
.spot-tabs{display:flex;gap:8px}
.spot-tabs button{
  flex:1;font-family:var(--sans);font-size:13px;padding:9px;border-radius:var(--r-sm);cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--tx-2);transition:.14s;
}
.spot-tabs button:hover{color:var(--tx)}
.spot-tabs button.on{background:color-mix(in oklch,var(--c) 14%,var(--panel));border-color:color-mix(in oklch,var(--c) 40%,transparent);color:var(--tx)}
.spot-side{display:flex;flex-direction:column;gap:var(--gap)}
.spot-side .scard{gap:11px}

/* ============ PANEL / CHARTS ============ */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);display:flex;flex-direction:column;gap:14px}
.panel-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.panel-h h2{font-size:14.5px;font-weight:600}
.legend{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx-2);background:var(--bg-2);border:1px solid var(--line);padding:4px 10px;border-radius:7px;cursor:pointer;font-family:var(--sans);transition:.13s}
.lg i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.lg:hover{color:var(--tx)}
.lg.dim{opacity:.4}
.lg.static{cursor:default}
.range-btns{display:flex;gap:3px;background:var(--bg-2);border:1px solid var(--line);border-radius:7px;padding:2px}
.range-btns button{font-family:var(--mono);font-size:11px;color:var(--tx-3);background:transparent;border:0;padding:4px 9px;border-radius:5px;cursor:pointer;transition:.12s}
.range-btns button:hover{color:var(--tx)}
.range-btns button.on{background:var(--elev);color:var(--tx)}

.chart{width:100%;border-radius:var(--r-sm);overflow:hidden}
.lg-chart{height:340px}
.price-chart{height:400px}
.eq-chart{height:150px}
.dd-chart{height:110px}
.sub-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3);font-weight:600;margin-top:2px}

/* ============ DETAIL ============ */
.detail-head{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;position:relative;overflow:hidden;min-height:64px}
.detail-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.back{font-family:var(--sans);font-size:12.5px;color:var(--tx-2);background:var(--bg-2);border:1px solid var(--line);padding:7px 13px;border-radius:8px;cursor:pointer;transition:.13s;white-space:nowrap;flex:none}
.back:hover{color:var(--tx);background:var(--elev)}
.dh-txt{flex:1;min-width:0;overflow:hidden}
.dh-txt b{font-size:17px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.dh-txt em{font-style:normal;font-size:11.5px;color:var(--tx-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dtabs{display:flex;gap:6px;flex:none;margin-left:auto}
.dtabs button{font-family:var(--sans);font-size:12.5px;color:var(--tx-2);background:var(--bg-2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;cursor:pointer;transition:.13s;white-space:nowrap}
.dtabs button:hover{color:var(--tx)}
.dtabs button.on{background:var(--elev);color:var(--tx);border-color:var(--line-2)}

.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media(max-width:1100px){.strip{grid-template-columns:repeat(5,1fr)}}
.strip-cell{background:var(--panel);padding:12px 13px;display:flex;flex-direction:column;gap:3px}
.strip-cell span{font-size:9.5px;color:var(--tx-3);letter-spacing:.04em;text-transform:uppercase}
.strip-cell b{font-family:var(--mono);font-size:16px;font-weight:600}
.strip-cell.v-good b{color:var(--good)} .strip-cell.v-bad b{color:var(--bad)} .strip-cell.v-mid b{color:var(--tx)}

/* ============ TABLES ============ */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm);border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.tbl th{background:var(--bg-2);text-align:left;padding:10px 14px;font-weight:600;font-size:11.5px;color:var(--tx-2);border-bottom:1px solid var(--line-2);position:sticky;top:0}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--line)}
.tbl tbody tr:hover{background:var(--bg-2)}
.tbl .tnum{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl .pos{color:var(--pos)} .tbl .neg{color:var(--neg)}
.side{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:5px}
.side.long{color:var(--pos);background:color-mix(in oklch,var(--pos) 12%,transparent)}
.side.short{color:var(--neg);background:color-mix(in oklch,var(--neg) 12%,transparent)}
.reason{font-family:var(--mono);font-size:10.5px;color:var(--tx-3);padding:2px 7px;border-radius:5px;background:var(--bg-2);border:1px solid var(--line)}
.tr-win td:first-child{box-shadow:inset 3px 0 0 color-mix(in oklch,var(--pos) 55%,transparent)}
.tr-loss td:first-child{box-shadow:inset 3px 0 0 color-mix(in oklch,var(--neg) 50%,transparent)}
.tbl.hist th.sep,.tbl.hist td.sep{border-left:1px solid var(--line-2)}
.tbl.hist .grp th{text-align:center;font-size:12px;padding:7px;background:var(--panel-2)}
.g-tl{color:#34d399} .g-ult{color:#fb923c} .g-bp{color:#22d3ee}

/* ============ RUN OVERLAY / TOAST ============ */
.run-ov{position:fixed;inset:0;background:rgba(6,8,11,.78);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:200;animation:pop .2s}
.run-box{background:var(--panel-2);border:1px solid var(--line-2);border-radius:16px;padding:30px 34px;width:380px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.run-title{font-size:16px;font-weight:600;margin-bottom:14px}
.run-step{font-size:12.5px;color:var(--tx-2);font-family:var(--mono);min-height:18px;margin-bottom:14px}
.run-bar{height:8px;border-radius:5px;background:var(--bg-2);overflow:hidden;border:1px solid var(--line)}
.run-bar span{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in oklch,var(--accent) 60%,#fff));transition:width .5s ease}
.run-pct{font-family:var(--mono);font-size:13px;color:var(--accent);margin-top:10px;font-weight:600}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);z-index:210;background:var(--elev);border:1px solid var(--line-2);border-radius:11px;padding:12px 20px;font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* lightweight-charts attribution hide tidy */
#main a[href*="tradingview"]{opacity:.25;font-size:9px!important}
/* Hide time axis on equity/drawdown sub-charts (keep data rendering) */
#d-equity .tv-lightweight-charts tr:last-child,
#d-dd .tv-lightweight-charts tr:last-child { display:none!important }
#d-equity table, #d-dd table { border-bottom:0!important }
